---
# tasks file for install_or_delete_sphinx
- block:
    - name: Installing Sphinx
      apt:
        name: "{{ sphinx_package | default('sphinxsearch') }}"
        state: present
        update_cache: yes

    - name: Ensuring Sphinx directories exist
      file:
        path: "{{ item.path }}"
        state: directory
        owner: sphinxsearch
        group: sphinxsearch
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/sphinxsearch, mode: '0755' }
        - { path: /etc/sphinxsearch/dicts, mode: '0755' }
        - { path: /var/run/sphinxsearch, mode: '0755' }
        - { path: /var/log/sphinxsearch, mode: '0755' }
        - { path: /var/lib/sphinxsearch/data, mode: '0750' }

    - name: Copying config to /etc/sphinxsearch/sphinx.conf
      copy:
        src: "sphinxsearch/"
        dest: "/etc/sphinxsearch/"
        owner: root
        group: sphinxsearch
        mode: '0644'
        directory_mode: '0755'

    - name: Enabling Sphinx in /etc/default (for cron reindex)
      lineinfile:
        path: /etc/default/sphinxsearch
        regexp: '^START='
        line: 'START=yes'
        create: yes

    - name: Creating systemd unit for Sphinx
      copy:
        dest: /etc/systemd/system/sphinxsearch.service
        mode: '0644'
        content: |
          [Unit]
          Description=Sphinx full-text search daemon
          After=network.target mysql.service
          Wants=network.target

          [Service]
          Type=forking
          User=sphinxsearch
          Group=sphinxsearch
          RuntimeDirectory=sphinxsearch
          RuntimeDirectoryMode=0755
          PIDFile=/var/run/sphinxsearch/searchd.pid
          ExecStartPre=/usr/bin/install -d -o sphinxsearch -g sphinxsearch /var/run/sphinxsearch /var/log/sphinxsearch /var/lib/sphinxsearch/data
          ExecStart=/usr/bin/searchd --config /etc/sphinxsearch/sphinx.conf
          ExecStop=/usr/bin/searchd --config /etc/sphinxsearch/sphinx.conf --stopwait
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd to apply changes
      systemd:
        daemon_reload: yes

    - name: Enabling and starting Sphinx
      systemd:
        name: "{{ sphinx_service_name | default('sphinxsearch') }}"
        enabled: yes
        state: restarted
  when: sphinx_action == 'INSTALL'

- block:
    - name: Stoping and disabling the Sphinx service
      systemd:
        name: "{{ sphinx_service_name | default('sphinxsearch') }}"
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove the systemd unit file
      file:
        path: /etc/systemd/system/sphinxsearch.service
        state: absent

    - name: Deleting Sphinx package
      apt:
        name: "{{ sphinx_package | default('sphinxsearch') }}"
        state: absent
        purge: yes

    - name: Reload systemd to apply changes
      systemd:
        daemon_reload: yes
  when: sphinx_action == 'DELETE'

---
# install rabbitmq
- name: Install rabbitmq-server
  apt:
    name: rabbitmq-server
    state: present

- name: Configure rabbitmq service
  template:
    src: rabbitmq.conf.j2
    dest: /etc/rabbitmq/rabbitmq.conf
    mode: '0644'
    owner: rabbitmq
    group: rabbitmq

- name: Configure rabbitmq environment
  template:
    src: rabbitmq-env.conf.j2
    dest: /etc/rabbitmq/rabbitmq-env.conf
    mode: '0644'
    owner: rabbitmq
    group: rabbitmq

- name: Enabled rabbitmq-server
  service:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Restart rabbitmq-server
  service:
    name: rabbitmq-server
    state: restarted

# Модули community.rabbitmq требуют отдельной коллекции, которой нет в базовой
# поставке Debian. Используем штатные rabbitmq-plugins / rabbitmqctl.
- name: Enable rabbitmq_management plugin
  command: rabbitmq-plugins enable rabbitmq_management
  register: rabbitmq_plugins_enable
  changed_when: "'already' not in (rabbitmq_plugins_enable.stdout | lower)"


- name: Create or update user for bitrix
  shell: |
    set -e
    if rabbitmqctl list_users | awk '{print $1}' | grep -qx "{{ bx_transformer_rabbitmq_user }}"; then
      rabbitmqctl change_password "{{ bx_transformer_rabbitmq_user }}" "{{ bx_transformer_rabbitmq_password }}"
    else
      rabbitmqctl add_user "{{ bx_transformer_rabbitmq_user }}" "{{ bx_transformer_rabbitmq_password }}"
    fi
    rabbitmqctl set_user_tags "{{ bx_transformer_rabbitmq_user }}" administrator
    rabbitmqctl set_permissions -p / "{{ bx_transformer_rabbitmq_user }}" ".*" ".*" ".*"
  no_log: true
  changed_when: true

# - name: Delete guest

---
# tasks file for install_or_delete_netdata
- block:
    - name: Checking bundled Netdata kickstart script
      stat:
        path: "{{ vendor_dir | default('/root/vm_menu/vendor') }}/scripts/netdata-kickstart.sh"
      register: netdata_kickstart

    - name: Installing Netdata (bundled kickstart)
      shell: cp -f "{{ netdata_kickstart.stat.path }}" /tmp/netdata-kickstart.sh && sh /tmp/netdata-kickstart.sh --non-interactive --stable-channel --disable-telemetry
      args:
        creates: /usr/sbin/netdata
      when: netdata_kickstart.stat.exists

    - name: Installing Netdata (remote kickstart)
      shell: wget -q -O /tmp/netdata-kickstart.sh https://get.netdata.cloud/kickstart.sh && sh /tmp/netdata-kickstart.sh --non-interactive --stable-channel --disable-telemetry
      args:
        creates: /usr/sbin/netdata
      when: not netdata_kickstart.stat.exists

    # --- Firewall: open the Netdata port in nftables ---
    # 'command -v' — встроенная команда shell, модуль command её не выполняет,
    # поэтому наличие nft проверяем через stat.
    - name: Checking nftables availability
      stat:
        path: "{{ nft_binary | default('/usr/sbin/nft') }}"
      register: nft_bin

    - name: Checking the nftables config file
      stat:
        path: "{{ nftables_config }}"
      register: nft_config

    - name: Allowing the Netdata port in the nftables config
      blockinfile:
        path: "{{ nftables_config }}"
        marker: "    # {mark} netdata (port {{ netdata_port }})"
        insertafter: "{{ nftables_anchor }}"
        block: |
          tcp dport {{ netdata_port }} accept comment "netdata"
      when:
        - nft_bin.stat.exists
        - nft_config.stat.exists | default(false)

    - name: Applying the Netdata rule to the running ruleset
      shell: |
        set -e
        if ! nft list chain inet filter input 2>/dev/null | grep -q "dport {{ netdata_port }}"; then
          nft add rule inet filter input tcp dport {{ netdata_port }} accept comment "netdata"
        fi
      when:
        - nft_bin.stat.exists
        - nft_config.stat.exists | default(false)
      changed_when: true

    - name: Reporting the opened port
      debug:
        msg:
          - "Порт {{ netdata_port }}/tcp открыт в nftables (http://<IP>:{{ netdata_port }})."
          - "Прямая ссылка также выводится в меню под панелью «Установлено»."

    - name: Copying nginx directory to /etc/{{ service_nginx_name }}
      copy:
        src: "nginx/"
        dest: "/etc/{{ service_nginx_name }}/"

    - name: Generating password for Netdata web access
      set_fact:
        netdata_web_password: "{{ lookup('password', '/root/.netdata_web_password length=16 chars=ascii_letters,digits') }}"
      no_log: true

    # htpasswd из apache2-utils (уже установлен) — чтобы не зависеть
    # от коллекции community.general, которой нет в базовой поставке.
    - name: Creating htpasswd file for Netdata
      command:
        argv:
          - htpasswd
          - -bc
          - "/etc/{{ service_nginx_name }}/netdata_passwds"
          - admin
          - "{{ netdata_web_password }}"
      no_log: true
      changed_when: true

    - name: Setting permissions on Netdata htpasswd file
      file:
        path: "/etc/{{ service_nginx_name }}/netdata_passwds"
        owner: root
        group: "{{ group_user_server_sites | default('www-data') }}"
        mode: '0640'

    - name: Showing Netdata web credentials
      debug:
        msg: "Netdata доступен по адресу https://<домен>/netdata/ — логин admin, пароль {{ netdata_web_password }}"

    - name: Restarting Nginx
      systemd:
        name: "{{ service_nginx_name }}"
        state: restarted

  when: netdata_action == 'INSTALL'

- block:
    - name: Find files deleting nginx configs
      find:
        paths: "{{ role_path }}/files/nginx"
        file_type: file
        recurse: yes
      register: found_files

    - name: Deleting files in /etc/{{ service_nginx_name }}
      file:
        path: "/etc/{{ service_nginx_name }}/{{ item.path | regex_replace('^' + role_path + '/files/nginx/', '') }}"
        state: absent
      loop: "{{ found_files.files }}"

    - name: Removing Netdata htpasswd file
      file:
        path: "/etc/{{ service_nginx_name }}/netdata_passwds"
        state: absent

    - name: Stoping Netdata service
      systemd:
        name: netdata
        state: stopped
      failed_when: false

    - name: Disable Netdata service
      systemd:
        name: netdata
        enabled: no
      failed_when: false

    # Netdata ставится набором пакетов (netdata + netdata-plugin-*, netdata-dashboard).
    # Если удалить только netdata, плагины остаются и при повторной установке dpkg
    # зацикливается на взаимных зависимостях ("netdata is not configured yet").
    - name: Finding installed Netdata packages
      shell: dpkg-query -W -f='${Package}\n' 'netdata*' 2>/dev/null || true
      register: netdata_installed_packages
      changed_when: false

    - name: Deleting all Netdata packages
      apt:
        name: "{{ netdata_installed_packages.stdout_lines }}"
        state: absent
        purge: yes
      when: netdata_installed_packages.stdout_lines | length > 0

    - name: Removing leftover Netdata packages if any
      shell: |
        set -e
        for pkg in $(dpkg-query -W -f='${Package}\n' 'netdata*' 2>/dev/null); do
          dpkg --purge --force-all "$pkg" || true
        done
      changed_when: false
      failed_when: false

    - name: Checking package database consistency
      command: dpkg --configure -a
      changed_when: false
      failed_when: false

    - name: Deleting Netdata directory
      file:
        path: /usr/sbin/netdata
        state: absent

    - name: Deleting Netdata configuration files
      file:
        path: /etc/netdata
        state: absent
        recurse: yes
      ignore_errors: yes


    - name: Deleting Netdata logs
      file:
        path: /var/log/netdata
        state: absent
        recurse: yes
      ignore_errors: yes

    - name: Deleting Netdata user
      user:
        name: netdata
        state: absent
      ignore_errors: yes

    # --- Firewall: close the Netdata port ---
    - name: Checking nftables availability before removal
      stat:
        path: "{{ nft_binary | default('/usr/sbin/nft') }}"
      register: nft_bin_remove

    - name: Checking the nftables config file before removal
      stat:
        path: "{{ nftables_config }}"
      register: nft_config_remove

    - name: Removing the Netdata rule from the nftables config
      blockinfile:
        path: "{{ nftables_config }}"
        marker: "    # {mark} netdata (port {{ netdata_port }})"
        state: absent
      when:
        - nft_bin_remove.stat.exists
        - nft_config_remove.stat.exists | default(false)

    - name: Reloading nftables without the Netdata rule
      command: nft -f {{ nftables_config }}
      when:
        - nft_bin_remove.stat.exists
        - nft_config_remove.stat.exists | default(false)
      changed_when: true

    - name: Restarting Nginx
      systemd:
        name: "{{ service_nginx_name }}"
        state: restarted

  when: netdata_action == 'DELETE'



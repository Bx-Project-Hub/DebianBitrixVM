---
# tasks file for settings_push_server

- name: Verifying that the domain is set
  fail:
    msg: "{{ push_messages[menu_lang | default('ru')].no_domain }}"
  when: push_domain | length == 0

# Сертификат: заданный явно, либо из ssl_conf/ssl_<домен>.conf сайта,
# либо найденный в каталоге сертификатов nginx.
- name: Reading certificate paths from the site ssl config
  shell: |
    set -e
    conf="{{ path_nginx }}/ssl_conf/ssl_{{ push_domain }}.conf"
    [ -f "$conf" ] || exit 0
    crt=$(awk '/^[[:space:]]*ssl_certificate[[:space:]]/ {print $2; exit}' "$conf" | tr -d ';')
    key=$(awk '/^[[:space:]]*ssl_certificate_key[[:space:]]/ {print $2; exit}' "$conf" | tr -d ';')
    case "$crt" in /*|"") ;; *) crt="{{ path_nginx }}/$crt" ;; esac
    case "$key" in /*|"") ;; *) key="{{ path_nginx }}/$key" ;; esac
    printf '%s\n%s\n' "$crt" "$key"
  register: push_cert_from_conf
  changed_when: false
  when: push_cert_path | length == 0

- name: Looking for certificate files of the domain
  find:
    paths:
      - "{{ path_nginx }}/ssl"
      - "{{ path_nginx }}/ssl_conf"
    patterns: "*{{ push_domain }}*"
    file_type: file
  register: push_cert_files
  when: push_cert_path | length == 0

- name: Setting resolved certificate paths
  set_fact:
    push_cert_resolved: >-
      {{ push_cert_path if push_cert_path | length > 0
         else (push_cert_from_conf.stdout_lines[0] | default('')
               if (push_cert_from_conf.stdout_lines | default([]) | length > 0 and push_cert_from_conf.stdout_lines[0] | length > 0)
               else (push_cert_files.files | map(attribute='path') | select('search', '\.crt$|\.pem$') | list | first | default(''))) }}
    push_key_resolved: >-
      {{ push_key_path if push_key_path | length > 0
         else (push_cert_from_conf.stdout_lines[1] | default('')
               if (push_cert_from_conf.stdout_lines | default([]) | length > 1 and push_cert_from_conf.stdout_lines[1] | length > 0)
               else (push_cert_files.files | map(attribute='path') | select('search', '\.key$') | list | first | default(''))) }}

- name: Failing when no certificate is found
  fail:
    msg: "{{ push_messages[menu_lang | default('ru')].no_cert | format(push_domain) }}"
  when: push_cert_resolved | length == 0 or push_key_resolved | length == 0

- name: Creating the nginx config for the publication domain
  template:
    src: push_site.conf.j2
    dest: "{{ path_nginx_sites_conf }}/{{ push_config_name }}"
    owner: root
    group: root
    mode: '0644'

- name: Enabling the publication domain
  file:
    src: "{{ path_nginx_sites_conf }}/{{ push_config_name }}"
    dest: "{{ path_nginx_sites_enabled }}/{{ push_config_name }}"
    state: link
    force: yes

- name: Checking nginx configuration
  command: nginx -t
  register: push_nginx_test
  changed_when: false

- name: Restarting nginx
  systemd:
    name: "{{ service_nginx_name }}"
    state: restarted

- name: Reporting the result
  debug:
    msg:
      - "{{ push_messages[menu_lang | default('ru')].created | format(path_nginx_sites_conf ~ '/' ~ push_config_name, push_domain, push_cert_resolved) }}"
      - "{{ push_messages[menu_lang | default('ru')].nginx_ok }}"
